[project]
name = "food-review-llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4", "numpy>=1.26", "joblib>=1.3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
lora = ["torch", "transformers>=4.40", "peft>=0.10", "datasets", "accelerate"]
hub = ["huggingface_hub"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702"]
